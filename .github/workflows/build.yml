name: build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  EFMAILAGENT_NO_BROWSER: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release
      - name: Test
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=linux.trx" --results-directory TestResults
      - name: Add-on tests (Node)
        working-directory: addon
        run: node --test "test/*.test.js"
      - name: Package add-on (XPI)
        run: node scripts/package-addon.mjs
      - name: End-to-end simulation (exe + simulated Thunderbird)
        env:
          EFMAILAGENT_DLL: src/EfMailAgent/bin/Release/net10.0/EfMailAgent.dll
        run: bash scripts/e2e-sim.sh
      - name: Validate sample rules with the CLI
        run: dotnet src/EfMailAgent/bin/Release/net10.0/EfMailAgent.dll validate-rules --data-dir "$RUNNER_TEMP/efdata"
      - name: API smoke test (service mode + dev-submit)
        run: |
          D="$RUNNER_TEMP/efapi"
          dotnet src/EfMailAgent/bin/Release/net10.0/EfMailAgent.dll --data-dir "$D" --no-browser > "$RUNNER_TEMP/efapi.log" 2>&1 &
          PID=$!
          for i in $(seq 1 60); do
            if [ -f "$D/appsettings.json" ]; then
              TOKEN=$(node -p "require('$D/appsettings.json').Server.Token")
              curl -sf -o /dev/null -H "X-EfMailAgent-Token: $TOKEN" http://127.0.0.1:47811/api/health && break
            fi
            sleep 1
          done
          node scripts/dev-submit.mjs --data-dir "$D"
          kill $PID
          wait $PID || true
          cat "$RUNNER_TEMP/efapi.log"
      - name: Install Playwright (Chromium) for the UI test
        run: |
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
          node "$RUNNER_TEMP/pw/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Admin UI usability test (scripts/ui-test.mjs)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node scripts/ui-test.mjs --exe "dotnet src/EfMailAgent/bin/Release/net10.0/EfMailAgent.dll" --out "$RUNNER_TEMP/ui-test"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-linux
          path: ${{ runner.temp }}/ui-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-linux
          path: TestResults

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build (build.ps1 - tests, XPI, single-file exe, installer)
        shell: pwsh
        run: ./build.ps1
      - name: End-to-end simulation (exe + simulated Thunderbird)
        shell: pwsh
        run: ./scripts/e2e-sim.ps1 -Exe dist/EfMailAgent.exe
      - name: Smoke test the exe
        shell: pwsh
        run: |
          $exe = Resolve-Path dist/EfMailAgent.exe
          $data = Join-Path $env:RUNNER_TEMP 'efdata'
          & $exe validate-rules --data-dir $data
          if ($LASTEXITCODE -ne 0) { throw "validate-rules failed with exit code $LASTEXITCODE" }
          $token = (& $exe print-token --data-dir $data | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $token.Length -ne 43) { throw "print-token returned an invalid token" }
          if (-not (Test-Path (Join-Path $data 'rules/eloreendeles/rule.yaml'))) { throw "sample rules were not copied" }

          # Full pipeline with the mock LLM: the demo email must produce the expected CSV (job_id and feldolgozva ignored).
          & $exe test-rule eloreendeles --file samples/emails/demo_eloreendeles_01.eml --write --data-dir $data
          if ($LASTEXITCODE -ne 0) { throw "test-rule --write failed with exit code $LASTEXITCODE" }
          $csv = Get-ChildItem (Join-Path $data 'output') -Filter 'eloreendeles_*.csv' | Select-Object -First 1
          if (-not $csv) { throw "no CSV was written" }
          function Mask([byte[]] $bytes) {
            $text = [System.Text.Encoding]::UTF8.GetString($bytes)
            $lines = $text -split "`r`n"
            for ($i = 1; $i -lt $lines.Length; $i++) {
              if ($lines[$i].Length -gt 0) { $parts = $lines[$i].Split(';', 3); $lines[$i] = '<job_id>;<feldolgozva>;' + $parts[2] }
            }
            return ($lines -join "`r`n")
          }
          $actual = [System.IO.File]::ReadAllBytes($csv.FullName)
          $expected = [System.IO.File]::ReadAllBytes((Resolve-Path samples/expected/demo_eloreendeles_01.csv))
          if ($actual[0] -ne 0xEF -or $actual[1] -ne 0xBB -or $actual[2] -ne 0xBF) { throw "CSV has no UTF-8 BOM" }
          if ((Mask $actual) -cne (Mask $expected)) { throw "CSV differs from samples/expected/demo_eloreendeles_01.csv" }
          Write-Host "Smoke test OK"
      - name: Standalone exe copied alone into an empty folder (no samples folder next to it)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'standalone'
          $data = Join-Path $env:RUNNER_TEMP 'standalone-data'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item dist/EfMailAgent.exe $dir
          Push-Location $dir
          $out = & "$dir\EfMailAgent.exe" validate-rules --data-dir $data | Out-String
          $code = $LASTEXITCODE
          Pop-Location
          Write-Host $out
          if ($code -ne 0) { throw "validate-rules failed with exit code $code" }
          foreach ($f in 'rules\_base\system.md', 'rules\eloreendeles\rule.yaml', 'rules\eloreendeles\prompt.md', 'rules\eloreendeles\skills\partnerek.md') {
            if (-not (Test-Path (Join-Path $data $f))) { throw "the standalone exe did not create $f from its built-in samples" }
          }
          if ((Get-Content (Join-Path $data 'appsettings.json') -Raw | ConvertFrom-Json).Llm.Provider -ne 'ollama') { throw 'a standalone first start must default to Ollama' }
          if (-not ($out -match 'eloreendeles')) { throw 'the sample rule is not listed' }
          Write-Host 'Standalone exe OK'
      - name: API smoke test (service mode + dev-submit.ps1)
        shell: pwsh
        run: |
          $exe = Resolve-Path dist/EfMailAgent.exe
          $data = Join-Path $env:RUNNER_TEMP 'efapi'
          $log = Join-Path $env:RUNNER_TEMP 'efapi'
          $process = Start-Process $exe -ArgumentList '--data-dir', $data, '--no-browser' -PassThru -NoNewWindow `
            -RedirectStandardOutput "$log.out" -RedirectStandardError "$log.err"
          $ready = $false
          for ($i = 0; $i -lt 60 -and -not $ready; $i++) {
            Start-Sleep -Seconds 1
            if (Test-Path (Join-Path $data 'appsettings.json')) {
              $token = (Get-Content (Join-Path $data 'appsettings.json') -Raw | ConvertFrom-Json).Server.Token
              try { Invoke-RestMethod -Uri 'http://127.0.0.1:47811/api/health' -Headers @{ 'X-EfMailAgent-Token' = $token } | Out-Null; $ready = $true } catch { }
            }
          }
          if (-not $ready) { Get-Content "$log.err"; throw "the API did not start" }
          & ./scripts/dev-submit.ps1 -DataDir $data
          if ($LASTEXITCODE -ne 0) { throw "dev-submit.ps1 failed" }
          Stop-Process -Id $process.Id
          $csv = Get-ChildItem (Join-Path $data 'output') -Filter 'eloreendeles_*.csv' | Select-Object -First 1
          if (-not $csv) { throw "no CSV was written" }
          Write-Host "API smoke test OK: $($csv.FullName)"
      - name: install-addon / addon-status / uninstall-addon against a fake Thunderbird folder
        shell: pwsh
        run: |
          $exe = Resolve-Path dist/EfMailAgent.exe
          $tb = Join-Path $env:RUNNER_TEMP 'fake-thunderbird'
          $data = Join-Path $env:RUNNER_TEMP 'efaddon'
          New-Item -ItemType Directory -Force (Join-Path $tb 'distribution') | Out-Null
          New-Item -ItemType File -Force (Join-Path $tb 'thunderbird.exe') | Out-Null
          Set-Content (Join-Path $tb 'application.ini') "[App]`nName=Thunderbird`nVersion=140.5.0esr"
          $policyPath = Join-Path $tb 'distribution/policies.json'
          Set-Content $policyPath '{ "policies": { "DisableAppUpdate": true, "3rdparty": { "Extensions": { "other@x": { "a": 1 } } } } }'

          & $exe install-addon --mode policy --thunderbird-dir $tb --data-dir $data
          if ($LASTEXITCODE -ne 0) { throw "install-addon failed with exit code $LASTEXITCODE" }
          $version = (Get-Content VERSION -Raw).Trim()
          $token = (& $exe print-token --data-dir $data | Out-String).Trim()
          $p = Get-Content $policyPath -Raw | ConvertFrom-Json
          if ($p.policies.DisableAppUpdate -ne $true) { throw "an unrelated policy was lost" }
          if ($p.policies.'3rdparty'.Extensions.'other@x'.a -ne 1) { throw "an unrelated 3rdparty entry was lost" }
          $entry = $p.policies.ExtensionSettings.'efmailagent@energofish.hu'
          if ($entry.installation_mode -ne 'force_installed') { throw "installation_mode is $($entry.installation_mode)" }
          if (-not $entry.install_url.StartsWith('file:///') -or -not $entry.install_url.EndsWith("efmailagent-$version.xpi")) { throw "install_url is $($entry.install_url)" }
          $managed = $p.policies.'3rdparty'.Extensions.'efmailagent@energofish.hu'
          if ($managed.serverUrl -ne 'http://127.0.0.1:47811' -or $managed.token -ne $token) { throw "3rdparty entry is wrong" }
          if (-not (Test-Path (Join-Path $data "addon/efmailagent-$version.xpi"))) { throw "XPI was not copied to the data folder" }
          if (-not (Get-ChildItem (Join-Path $tb 'distribution') -Filter 'policies.json.bak-*')) { throw "no backup was made" }

          & $exe addon-status --thunderbird-dir $tb --data-dir $data
          if ($LASTEXITCODE -ne 0) { throw "addon-status is not OK ($LASTEXITCODE)" }

          & $exe uninstall-addon --thunderbird-dir $tb --data-dir $data
          if ($LASTEXITCODE -ne 0) { throw "uninstall-addon failed with exit code $LASTEXITCODE" }
          $p = Get-Content $policyPath -Raw | ConvertFrom-Json
          if ($p.policies.ExtensionSettings -or $p.policies.'3rdparty'.Extensions.'efmailagent@energofish.hu') { throw "our entries were not removed" }
          if ($p.policies.DisableAppUpdate -ne $true -or $p.policies.'3rdparty'.Extensions.'other@x'.a -ne 1) { throw "uninstall removed unrelated keys" }
          Write-Host "Add-on installation smoke test OK"
      - name: Installer - first install with wizard parameters on a machine with Thunderbird
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $data = 'C:\ProgramData\EfMailAgent'
          $app = "$env:ProgramFiles\EfMailAgent"
          $version = (Get-Content VERSION -Raw).Trim()

          # A Thunderbird the installer can find the same way as on the server: registry key + install folder.
          $tb = 'C:\FakeThunderbird'
          New-Item -ItemType Directory -Force "$tb\distribution" | Out-Null
          New-Item -ItemType File -Force "$tb\thunderbird.exe" | Out-Null
          Set-Content "$tb\application.ini" "[App]`nName=Thunderbird`nVersion=140.5.0esr"
          Set-Content "$tb\distribution\policies.json" '{ "policies": { "DisableAppUpdate": true } }'
          $key = 'HKLM:\SOFTWARE\Mozilla\Mozilla Thunderbird\140.5.0esr (x64 hu)\Main'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name 'Install Directory' -Value $tb -PropertyType String -Force | Out-Null

          $log = "$env:RUNNER_TEMP\setup-install.log"
          $p = Start-Process (Resolve-Path dist/EfMailAgent-Setup.exe) -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$log",
            '/LLMURL=http://127.0.0.1:11500', '/LLMMODEL=qwen3.5:9b', '/OUTPUT=C:\efm-out'
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 60; throw "setup exit code $($p.ExitCode)" }

          # Service
          $service = Get-Service EfMailAgent
          if ($service.Status -ne 'Running') { throw "service status: $($service.Status)" }
          if ($service.StartType -notin @('Automatic', 'AutomaticDelayedStart')) { throw "start type: $($service.StartType)" }
          if (-not ((sc.exe qc EfMailAgent | Out-String) -match 'DELAYED')) { throw 'service is not delayed-auto' }
          if (-not ((sc.exe qfailure EfMailAgent | Out-String) -match 'RESTART')) { throw 'no restart recovery action' }

          # Wizard values reached appsettings.json
          $settings = Get-Content "$data\appsettings.json" -Raw | ConvertFrom-Json
          if ($settings.Llm.Provider -ne 'ollama') { throw "provider: $($settings.Llm.Provider)" }
          if ($settings.Llm.BaseUrl -ne 'http://127.0.0.1:11500') { throw "base url: $($settings.Llm.BaseUrl)" }
          if ($settings.Llm.Model -ne 'qwen3.5:9b') { throw "model: $($settings.Llm.Model)" }
          if ($settings.Paths.Output -ne 'C:\efm-out') { throw "output: $($settings.Paths.Output)" }
          if ($settings.Server.Token.Length -ne 43) { throw 'token missing or malformed' }

          # API, admin UI, health: AI not reachable yet (nothing listens on 11500), version matches
          $token = $settings.Server.Token
          for ($i = 0; $i -lt 60; $i++) { try { $health = Invoke-RestMethod 'http://127.0.0.1:47811/api/health' -Headers @{ 'X-EfMailAgent-Token' = $token }; break } catch { Start-Sleep 1 } }
          if (-not $health) { Get-ChildItem "$data\logs" | ForEach-Object { Get-Content $_.FullName -Tail 40 }; throw 'the service API did not answer' }
          Write-Host "health: $($health | ConvertTo-Json -Compress)"
          if ($health.version -ne $version) { throw "unexpected version $($health.version)" }
          if ($health.llmReachable) { throw 'LLM reported reachable although nothing listens on the configured port' }
          if ((Invoke-WebRequest 'http://127.0.0.1:47811/admin/' -UseBasicParsing).StatusCode -ne 200) { throw 'admin UI not served' }
          try { Invoke-WebRequest 'http://127.0.0.1:47811/api/health' -UseBasicParsing | Out-Null; throw 'API answered without token' } catch { if ($_.Exception.Response.StatusCode.value__ -ne 401) { throw } }

          # Installed files
          foreach ($f in "$app\EfMailAgent.exe", "$app\USER_GUIDE_HU.md", "$app\samples\emails\index.json", "$app\samples\rules\eloreendeles\rule.yaml",
                          "$data\rules\eloreendeles\rule.yaml", "$data\rules\_base\system.md") {
            if (-not (Test-Path $f)) { throw "missing after install: $f" }
          }

          # Thunderbird add-on installed by the setup itself (policies.json merged, token handed over, XPI in place)
          $policies = Get-Content "$tb\distribution\policies.json" -Raw | ConvertFrom-Json
          if ($policies.policies.DisableAppUpdate -ne $true) { throw 'an existing Thunderbird policy was lost' }
          $entry = $policies.policies.ExtensionSettings.'efmailagent@energofish.hu'
          if ($entry.installation_mode -ne 'force_installed') { throw "add-on not force-installed: $($entry | ConvertTo-Json -Compress)" }
          $xpi = [Uri]::new($entry.install_url).LocalPath
          if (-not (Test-Path $xpi) -or -not $xpi.StartsWith("$data\addon")) { throw "XPI not found: $xpi" }
          if ($policies.policies.'3rdparty'.Extensions.'efmailagent@energofish.hu'.token -ne $token) { throw 'the add-on did not get the token' }
          & "$app\EfMailAgent.exe" addon-status
          if ($LASTEXITCODE -ne 0) { throw "addon-status: $LASTEXITCODE" }

          # Shortcuts to the admin UI (Start menu always, desktop by default)
          foreach ($lnk in "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\EfMailAgent kezelőfelület.lnk", "$env:PUBLIC\Desktop\EfMailAgent kezelőfelület.lnk") {
            if (-not (Test-Path -LiteralPath $lnk)) { throw "missing shortcut: $lnk" }
            # The target path is stored in the .lnk (ANSI and/or UTF-16); WScript.Shell returns an empty object for this name.
            $bytes = [IO.File]::ReadAllBytes($lnk)
            $text = [Text.Encoding]::Unicode.GetString($bytes) + [Text.Encoding]::ASCII.GetString($bytes)
            if ($text -notmatch [regex]::Escape('EfMailAgent\EfMailAgent.exe')) { throw "shortcut $lnk does not point to $app\EfMailAgent.exe" }
            Write-Host "shortcut OK: $lnk" 
          }

          # open-admin (also used by the installer's last page) works read-only and prints the admin URL
          $out = & "$app\EfMailAgent.exe" open-admin | Out-String
          if ($LASTEXITCODE -ne 0 -or -not ($out -match '127\.0\.0\.1:47811/admin/')) { throw "open-admin: $LASTEXITCODE $out" }
          Write-Host 'First install OK'
      - name: Install Playwright (Chromium) for the UI test
        shell: pwsh
        run: |
          npm install --no-audit --no-fund --prefix "$env:RUNNER_TEMP\pw" playwright@1.63.0
          node "$env:RUNNER_TEMP\pw\node_modules\playwright\cli.js" install chromium
      - name: Admin UI usability test against the installed service
        shell: pwsh
        env:
          NODE_PATH: ${{ runner.temp }}\pw\node_modules
        run: |
          $token = (Get-Content 'C:\ProgramData\EfMailAgent\appsettings.json' -Raw | ConvertFrom-Json).Server.Token
          node scripts/ui-test.mjs --url http://127.0.0.1:47811 --token $token --out "$env:RUNNER_TEMP\ui-test-installed"
          if ($LASTEXITCODE -ne 0) { Get-ChildItem 'C:\ProgramData\EfMailAgent\logs' | ForEach-Object { Get-Content $_.FullName -Tail 60 }; throw 'UI test failed' }
          $csv = Get-ChildItem 'C:\efm-out' -Filter 'reklamacio_*.csv'
          if (-not $csv) { throw 'the CSV was not written to the output folder chosen in the installer' }
          Write-Host "CSV in the chosen output folder: $($csv.FullName)"
      - name: Installer - upgrade to a higher version, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $data = 'C:\ProgramData\EfMailAgent'
          $app = "$env:ProgramFiles\EfMailAgent"
          $tb = 'C:\FakeThunderbird'
          function Wait-Health() {
            $token = (Get-Content "$data\appsettings.json" -Raw | ConvertFrom-Json).Server.Token
            for ($i = 0; $i -lt 60; $i++) {
              try { return Invoke-RestMethod -Uri 'http://127.0.0.1:47811/api/health' -Headers @{ 'X-EfMailAgent-Token' = $token } } catch { Start-Sleep 1 }
            }
            Get-ChildItem "$data\logs" -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 40 }
            throw 'the service API did not answer'
          }

          # State the upgrade must keep: settings changed in the UI, the rule created in the UI, local prompt edit, output
          $before = Get-Content "$data\appsettings.json" -Raw | ConvertFrom-Json
          Add-Content "$data\rules\eloreendeles\prompt.md" "`n- Helyi módosítás, frissítéskor meg kell maradnia."
          $promptBefore = Get-Content "$data\rules\eloreendeles\prompt.md" -Raw
          $reklamacioBefore = Get-Content "$data\rules\reklamacio\rule.yaml" -Raw

          # Upgrade with a higher version (same binaries, installer version 99.0.0)
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\upgrade" | Out-Null
          Copy-Item dist\EfMailAgent.exe, dist\efmailagent.xpi "$env:RUNNER_TEMP\upgrade"
          & $iscc /Q /DAppVersion=99.0.0 "/DDistDir=$env:RUNNER_TEMP\upgrade" "/DRepoDir=$PWD" installer\EfMailAgent.iss
          if ($LASTEXITCODE -ne 0) { throw 'iscc (upgrade build) failed' }
          $log = "$env:RUNNER_TEMP\setup-upgrade.log"
          $p = Start-Process "$env:RUNNER_TEMP\upgrade\EfMailAgent-Setup.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 60; throw "upgrade exit code $($p.ExitCode)" }
          if ((Get-Service EfMailAgent).Status -ne 'Running') { throw 'service not running after upgrade' }
          Wait-Health | Out-Null
          $after = Get-Content "$data\appsettings.json" -Raw | ConvertFrom-Json
          if ($after.Server.Token -ne $before.Server.Token) { throw 'token changed on upgrade' }
          if ($after.Llm.Provider -ne $before.Llm.Provider -or $after.Paths.Output -ne $before.Paths.Output) { throw 'settings were reset on upgrade' }
          if ((Get-Content "$data\rules\eloreendeles\prompt.md" -Raw) -ne $promptBefore) { throw 'rules were overwritten on upgrade' }
          if ((Get-Content "$data\rules\reklamacio\rule.yaml" -Raw) -ne $reklamacioBefore) { throw 'the rule created in the UI changed on upgrade' }
          if (-not (Get-ChildItem 'C:\efm-out' -Filter 'reklamacio_*.csv')) { throw 'output was touched on upgrade' }
          $version = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{7E3C6A52-9C1B-4F4B-9E0A-3B5D2C8F1A71}_is1').DisplayVersion
          if ($version -ne '99.0.0') { throw "installed version after upgrade: $version" }
          $entry = (Get-Content "$tb\distribution\policies.json" -Raw | ConvertFrom-Json).policies.ExtensionSettings.'efmailagent@energofish.hu'
          if (-not $entry) { throw 'the add-on policy entry disappeared on upgrade' }

          # Uninstall (silent: data is kept, the add-on entry is removed, other Thunderbird policies stay)
          $p = Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          for ($i = 0; $i -lt 60 -and (Test-Path "$app\EfMailAgent.exe"); $i++) { Start-Sleep 1 }
          if (Get-Service EfMailAgent -ErrorAction SilentlyContinue) { throw 'service still exists after uninstall' }
          if (Test-Path "$app\EfMailAgent.exe") { throw 'program files still present' }
          if (-not (Test-Path "$data\appsettings.json")) { throw 'data folder was deleted although the default is to keep it' }
          if (-not (Test-Path "$data\rules\reklamacio\rule.yaml")) { throw 'rules were deleted on uninstall' }
          $policies = (Get-Content "$tb\distribution\policies.json" -Raw | ConvertFrom-Json).policies
          if ($policies.ExtensionSettings.'efmailagent@energofish.hu' -or $policies.'3rdparty'.Extensions.'efmailagent@energofish.hu') { throw 'the add-on policy entries were not removed on uninstall' }
          if ($policies.DisableAppUpdate -ne $true) { throw 'uninstall removed an unrelated Thunderbird policy' }
          if (Test-Path -LiteralPath "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\EfMailAgent kezelőfelület.lnk") { throw 'Start menu shortcut left after uninstall' }
          if (Test-Path -LiteralPath "$env:PUBLIC\Desktop\EfMailAgent kezelőfelület.lnk") { throw 'desktop shortcut left after uninstall' }
          Write-Host 'Installer test OK'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-logs
          path: ${{ runner.temp }}/setup-*.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-installed
          path: ${{ runner.temp }}/ui-test-installed
      - uses: actions/upload-artifact@v4
        with:
          name: EfMailAgent-Setup
          path: dist/EfMailAgent-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: EfMailAgent-win-x64
          path: dist/EfMailAgent.exe
      - uses: actions/upload-artifact@v4
        with:
          name: efmailagent-xpi
          path: dist/efmailagent.xpi

  # Publishes a GitHub Release for the version in VERSION once both jobs (tests, UI test, installer test) are green.
  # Runs only for pushes to the default branch and only if the tag v<VERSION> does not exist yet.
  release:
    needs: [linux, windows]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Decide
        id: decide
        run: |
          VERSION=$(tr -d ' \r\n' < VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" > /dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "v$VERSION already exists, nothing to release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.decide.outputs.publish == 'true'
        with:
          path: artifacts
          pattern: '{EfMailAgent-Setup,EfMailAgent-win-x64,efmailagent-xpi}'
          merge-multiple: true
      - name: Create release v${{ steps.decide.outputs.version }}
        if: steps.decide.outputs.publish == 'true'
        run: |
          VERSION="${{ steps.decide.outputs.version }}"
          cd artifacts
          ls -la
          for f in EfMailAgent-Setup.exe EfMailAgent.exe efmailagent.xpi; do test -f "$f" || { echo "missing $f"; exit 1; }; done
          sha256sum EfMailAgent-Setup.exe EfMailAgent.exe efmailagent.xpi > SHA256SUMS.txt
          awk -v v="## $VERSION " 'index($0, v) == 1 { on = 1; next } on && /^## / { exit } on' ../docs/RELEASE_NOTES.md > notes.md
          test -s notes.md || { echo "no section for $VERSION in docs/RELEASE_NOTES.md"; exit 1; }
          gh release create "v$VERSION" EfMailAgent-Setup.exe EfMailAgent.exe efmailagent.xpi SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "EfMailAgent $VERSION" --notes-file notes.md

